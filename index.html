<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mappa Viaggi</title>
<meta name="description" content="La mia mappa per i viaggi: percorsi da un punto a un altro e punti salvati.">
<meta name="robots" content="noindex">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 22s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z" fill="%23B5634D"/><circle cx="12" cy="10" r="2.6" fill="%23fff"/></svg>'>
<link rel="stylesheet" href="fonts/poppins.css">
<link rel="stylesheet" href="vendor/leaflet.min.css">
<style>
/* Layout: barra in alto con le schede, pannello a sinistra (percorsi / punti), mappa a destra a tutto schermo.
   Palette: la stessa del Taccuino di viaggio (sabbia, terracotta, salvia, marrone scuro). */
:root {
  --bg: #F5F1EB; --surface: #FFFFFF; --ink: #3E3B36; --muted: #6F675D; --line: #E6DED2; --sand: #C7B8A2;
  --accent: #B5634D; --accent-ink: #FFFFFF; --accent-soft: #F4E4DD;
  --ok: #4C7A3C; --ok-soft: #E5EFDE; --alert: #A63D2F; --alert-soft: #F6DED8; --todo: #8A6A3E; --todo-soft: #F6E7CF;
  --sage: #7FA36E; --blue: #2F6DB5;
  --f-body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-card: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2A2825; --surface: #34312D; --ink: #F5F1EB; --muted: #C7B8A2; --line: #4A453F; --sand: #7E7363;
    --accent: #D79D76; --accent-ink: #2A2825; --accent-soft: #4A372F;
    --ok: #9BBF8A; --ok-soft: #313B2B; --alert: #E58C7A; --alert-soft: #48302A; --todo: #D9B98A; --todo-soft: #44392A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2A2825; --surface: #34312D; --ink: #F5F1EB; --muted: #C7B8A2; --line: #4A453F; --sand: #7E7363;
  --accent: #D79D76; --accent-ink: #2A2825; --accent-soft: #4A372F;
  --ok: #9BBF8A; --ok-soft: #313B2B; --alert: #E58C7A; --alert-soft: #48302A; --todo: #D9B98A; --todo-soft: #44392A; color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100%; scrollbar-gutter: stable; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
h1, h2 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 20px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.topbar { display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); background: var(--bg);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.brand { font-weight: 600; font-size: 20px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
@media (max-width: 480px) { .brand { display: none; } .tabs { justify-content: center; } }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: transparent; color: var(--muted); padding: 9px 14px; border-radius: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.tab:hover { background: var(--surface); color: var(--ink); }
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.icon-btn { flex: none; width: 44px; height: 44px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; font-size: 18px; }
.icon-btn:hover { border-color: var(--accent); }

.body { display: grid; grid-template-columns: 400px minmax(0, 1fr); min-height: 0; }
.panel { overflow-y: auto; display: grid; gap: 14px; align-content: start; min-width: 0; border-right: 1px solid var(--line);
  padding: 14px max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.map-wrap { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--line); }
@media (max-width: 760px) {
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52vh minmax(0, 1fr); }
  .map-wrap { order: -1; }
  .panel { border-right: 0; border-top: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; min-width: 0; }
.stack { display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.meta { color: var(--muted); font-size: 14px; }
.empty { color: var(--muted); margin: 0; padding: 8px 0; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.input { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.input:focus { border-color: var(--accent); outline: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 24px; font-size: 17px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.wide { width: 100%; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: 15px; }
.btn.danger { color: var(--alert); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip { display: inline-flex; align-items: center; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }

/* Partenza e arrivo */
.slot { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: end; padding: 8px; border-radius: 14px; border: 1.5px solid transparent; }
.slot.active { border-color: var(--accent); background: var(--accent-soft); }
.badge { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); margin-bottom: 3px; }
.badge.a { background: #4C7A3C; }
.badge.b { background: #A63D2F; }
.x { width: 44px; height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; color: var(--muted); }
.x:hover { border-color: var(--accent); color: var(--accent); }
.results { list-style: none; margin: -8px 0 0; padding: 6px; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--surface); display: grid; gap: 2px; }
.results li.meta { padding: 8px 10px; }
.res { all: unset; box-sizing: border-box; display: grid; width: 100%; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.res:hover, .res:focus-visible { background: var(--accent-soft); outline: none; }
.res span { font-size: 13px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.figs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fig { display: grid; gap: 2px; padding: 12px 16px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
.fig b { font-size: 28px; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; }
.fig span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.item { display: grid; gap: 10px; }
.item.current { border-color: var(--accent); }
.item-head { display: flex; gap: 10px; align-items: center; min-width: 0; }
.item b { overflow-wrap: anywhere; }
.linkbox { font-size: 13px; }

/* Tendina rotonda collegata al box (stile-fred) */
.tendina { position: relative; }
.tendina select { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.tendina-box { width: 100%; min-height: 46px; padding: 10px 44px 10px 16px; border-radius: 16px; border: 1.5px solid var(--line);
  background: var(--surface); text-align: left; cursor: pointer; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tendina-box::after { content: ""; position: absolute; right: 18px; top: 50%; width: 8px; height: 8px; margin-top: -6px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
.tendina-box:hover, .tendina.aperta .tendina-box { border-color: var(--accent); }
.tendina.aperta .tendina-box { border-radius: 16px 16px 0 0; border-bottom-color: var(--line); }
.tendina.aperta .tendina-box::after { transform: rotate(225deg); margin-top: -2px; }
.tendina-lista { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin: 0; padding: 6px; list-style: none;
  background: var(--surface); border: 1.5px solid var(--accent); border-top: 0; border-radius: 0 0 16px 16px;
  box-shadow: 0 14px 30px rgba(40, 25, 15, .18); max-height: 280px; overflow-y: auto; }
.tendina-lista li { padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.tendina-lista li:hover, .tendina-lista li.attiva { background: var(--accent-soft); }
.tendina-lista li[aria-selected="true"] { color: var(--accent); font-weight: 600; }

/* Sulla mappa */
.mk { background: none; border: 0; }
.pin { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: #fff; font: 700 14px var(--f-body); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
.pin.a { background: #4C7A3C; }
.pin.b { background: #A63D2F; }
.dot { display: block; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
.dot.inline { flex: none; width: 20px; height: 20px; border-color: var(--surface); box-shadow: none; }
.dot.evento { background: #B5634D; }
.dot.attivita { background: #7FA36E; }
.dot.altro { background: #8A6A3E; }
.dot.pending { background: #fff; border: 3px dashed #3E3B36; }
.leaflet-tooltip.lbl { font: 600 13px var(--f-body); background: #F5F1EB; color: #3E3B36; border: 1.5px solid #3E3B36; border-radius: 8px; padding: 3px 8px; box-shadow: none; }
.leaflet-tooltip.lbl::before { display: none; }
.leaflet-container { font-family: var(--f-body); }
.leaflet-bar a { width: 40px; height: 40px; line-height: 40px; font-size: 20px; }
.map-btn { min-width: 44px; height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 15px var(--f-body); cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .18); display: inline-flex; align-items: center; gap: 6px; }
.map-btn:hover { border-color: var(--accent); }
.map-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.map-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .leaflet-layer.osm { filter: brightness(.82) contrast(1.05); } }
:root[data-theme="dark"] .leaflet-layer.osm { filter: brightness(.82) contrast(1.05); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 2000;
  background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-weight: 600; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <b class="brand">Mappa Viaggi</b>
    <nav class="tabs" aria-label="Sezioni">
      <button class="tab" type="button" data-tab="percorsi" aria-current="page">Percorsi</button>
      <button class="tab" type="button" data-tab="punti">Punti</button>
    </nav>
    <button class="icon-btn" type="button" id="fs" aria-label="Schermo intero" title="Schermo intero">⛶</button>
  </header>
  <div class="body">
    <aside class="panel" id="panel">
      <section id="sec-percorsi" class="stack" aria-label="Percorsi">
        <div class="field"><label for="mezzo">Come</label>
          <select class="input" id="mezzo"><option value="piedi">A piedi</option><option value="bici">In bici</option><option value="auto">In auto</option></select></div>
        <div class="slot active" id="slot-A">
          <button class="badge a" type="button" data-pick="A" aria-label="Partenza: scegli sulla mappa">A</button>
          <div class="field"><label for="q-A">Partenza</label><input class="input" id="q-A" data-q="A" placeholder="Cerca un posto o tocca la mappa" autocomplete="off"></div>
          <button class="x" type="button" id="clear-A" data-clear="A" aria-label="Togli la partenza" hidden>✕</button>
        </div>
        <ul class="results" id="res-A" hidden></ul>
        <div class="slot" id="slot-B">
          <button class="badge b" type="button" data-pick="B" aria-label="Arrivo: scegli sulla mappa">B</button>
          <div class="field"><label for="q-B">Arrivo</label><input class="input" id="q-B" data-q="B" placeholder="Cerca un posto o tocca la mappa" autocomplete="off"></div>
          <button class="x" type="button" id="clear-B" data-clear="B" aria-label="Togli l'arrivo" hidden>✕</button>
        </div>
        <ul class="results" id="res-B" hidden></ul>
        <div class="row"><button class="btn small" type="button" id="gps-slot">La mia posizione</button><button class="btn small" type="button" id="swap">⇄ Inverti</button></div>
        <div id="result"></div>
        <h2 id="routes-title">I miei percorsi</h2>
        <div id="routes" class="stack"></div>
      </section>
      <section id="sec-punti" class="stack" aria-label="Punti" hidden>
        <p class="meta" id="pt-hint" style="margin:0">Tocca la mappa dove vuoi segnare il punto.</p>
        <div id="pt-form"></div>
        <h2>I miei punti</h2>
        <div id="points" class="stack"></div>
      </section>
      <div id="linkbox" class="field" hidden><label for="linkbox-in">Link da copiare</label><input class="input linkbox" id="linkbox-in" readonly></div>
    </aside>
    <div class="map-wrap"><div id="map" aria-label="Mappa"></div></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script src="vendor/leaflet.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast("Non riesco a salvare su questo dispositivo"); } },
  };
  const MODES = {
    piedi: { label: "A piedi", osrm: "routed-foot/route/v1/foot", g: "walking", om: "pedestrian" },
    bici: { label: "In bici", osrm: "routed-bike/route/v1/bike", g: "bicycling", om: "bicycle" },
    auto: { label: "In auto", osrm: "routed-car/route/v1/driving", g: "driving", om: "vehicle" },
  };
  const CATS = { evento: "Evento", attivita: "Attività", altro: "Altro" };
  const fmtKm = m => { m = Number(m) || 0; return m < 950 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1).replace(".", ",")} km`; };
  const fmtMin = s => { const m = Math.round((Number(s) || 0) / 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`; };
  const S = { tab: "percorsi", mode: LS.get("mappa-mezzo", "piedi"), A: null, B: null, slot: "A", route: null, savedId: null, draftName: "",
    routes: LS.get("mappa-percorsi", []), points: LS.get("mappa-punti", []), pending: null };
  if (!MODES[S.mode]) S.mode = "piedi";

  let toastTimer;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800); }

  /* ---------- Tendina rotonda (stile-fred) ---------- */
  const chiudiTendine = fuori => document.querySelectorAll(".tendina.aperta").forEach(w => { if (w !== fuori) w.chiudi(); });
  document.addEventListener("pointerdown", e => { const w = e.target.closest && e.target.closest(".tendina"); chiudiTendine(w); });
  function tendine(root) {
    root.querySelectorAll("select.input:not([data-tendina])").forEach(sel => {
      sel.dataset.tendina = "1"; sel.tabIndex = -1;
      const wrap = document.createElement("div"); wrap.className = "tendina";
      sel.replaceWith(wrap); wrap.append(sel);
      const box = document.createElement("button"); box.type = "button"; box.className = "tendina-box";
      box.setAttribute("aria-haspopup", "listbox"); box.setAttribute("aria-expanded", "false");
      if (sel.id) { box.id = sel.id; sel.removeAttribute("id"); }
      const list = document.createElement("ul"); list.className = "tendina-lista"; list.setAttribute("role", "listbox"); list.hidden = true;
      wrap.append(box, list);
      let att = -1;
      const sync = () => { box.textContent = sel.options[sel.selectedIndex]?.text || ""; };
      const evid = i => { att = i; [...list.children].forEach((li, k) => li.classList.toggle("attiva", k === i)); list.children[i]?.scrollIntoView({ block: "nearest" }); };
      const chiudi = wrap.chiudi = () => { wrap.classList.remove("aperta"); list.hidden = true; box.setAttribute("aria-expanded", "false"); };
      const scegli = i => { if (i >= 0 && i !== sel.selectedIndex) { sel.selectedIndex = i; sel.dispatchEvent(new Event("change", { bubbles: true })); } sync(); chiudi(); box.focus(); };
      const apri = () => {
        chiudiTendine(wrap);
        list.innerHTML = [...sel.options].map((o, i) => `<li role="option" data-i="${i}" aria-selected="${i === sel.selectedIndex}"></li>`).join("");
        [...sel.options].forEach((o, i) => { list.children[i].textContent = o.text; });
        wrap.classList.add("aperta"); list.hidden = false; box.setAttribute("aria-expanded", "true"); evid(sel.selectedIndex);
      };
      box.addEventListener("click", () => list.hidden ? apri() : chiudi());
      list.addEventListener("click", e => { const li = e.target.closest("li"); if (li) scegli(Number(li.dataset.i)); });
      list.addEventListener("pointermove", e => { const li = e.target.closest("li"); if (li) evid(Number(li.dataset.i)); });
      box.addEventListener("keydown", e => {
        const n = sel.options.length;
        if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (list.hidden) apri(); else evid((att + (e.key === "ArrowDown" ? 1 : n - 1)) % n); }
        else if ((e.key === "Enter" || e.key === " ") && !list.hidden) { e.preventDefault(); scegli(att); }
        else if (e.key === "Escape" || e.key === "Tab") chiudi();
      });
      sel.addEventListener("change", sync); sync();
    });
  }

  /* ---------- Mappa ---------- */
  const view = LS.get("mappa-vista", { lat: 42.5, lon: 12.5, z: 6 });
  const map = L.map("map", { zoomControl: true, tap: false }).setView([view.lat, view.lon], view.z);
  const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, className: "osm", attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' });
  const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Esri, Maxar, Earthstar Geographics" });
  let base = LS.get("mappa-base", "mappa");
  (base === "sat" ? sat : osm).addTo(map);
  map.on("moveend", () => { const c = map.getCenter(); LS.set("mappa-vista", { lat: +c.lat.toFixed(5), lon: +c.lng.toFixed(5), z: map.getZoom() }); });
  const layers = { route: L.layerGroup().addTo(map), ends: L.layerGroup().addTo(map), points: L.layerGroup().addTo(map), me: L.layerGroup().addTo(map), pending: L.layerGroup().addTo(map) };
  const ICO_ME = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
  const ctl = (html, label, onClick) => {
    const C = L.Control.extend({ onAdd() {
      const b = L.DomUtil.create("button", "map-btn"); b.type = "button"; b.innerHTML = html; b.setAttribute("aria-label", label); b.title = label;
      L.DomEvent.disableClickPropagation(b); L.DomEvent.disableScrollPropagation(b); b.addEventListener("click", onClick); return b; } });
    return new C({ position: "topright" }).addTo(map);
  };
  const baseBtn = ctl(base === "sat" ? "Mappa" : "Satellite", "Cambia lo sfondo della mappa", () => {
    if (base === "sat") { map.removeLayer(sat); osm.addTo(map); base = "mappa"; } else { map.removeLayer(osm); sat.addTo(map); base = "sat"; }
    LS.set("mappa-base", base); baseBtn.getContainer().textContent = base === "sat" ? "Mappa" : "Satellite";
  });
  const meBtn = ctl(ICO_ME, "Dove sono", toggleWatch);
  meBtn.getContainer().setAttribute("aria-pressed", "false");
  let watchId = null, firstFix = true;
  function toggleWatch() {
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; layers.me.clearLayers(); meBtn.getContainer().setAttribute("aria-pressed", "false"); return; }
    if (!navigator.geolocation) { toast("La posizione non è disponibile su questo dispositivo"); return; }
    firstFix = true; meBtn.getContainer().setAttribute("aria-pressed", "true");
    watchId = navigator.geolocation.watchPosition(p => {
      const ll = [p.coords.latitude, p.coords.longitude];
      layers.me.clearLayers();
      L.circle(ll, { radius: p.coords.accuracy || 0, color: "#2F6DB5", weight: 1, fillOpacity: .12 }).addTo(layers.me);
      L.circleMarker(ll, { radius: 8, color: "#fff", weight: 3, fillColor: "#2F6DB5", fillOpacity: 1 }).addTo(layers.me).bindTooltip("Sei qui", { direction: "top", offset: [0, -8], className: "lbl" });
      if (firstFix) { firstFix = false; map.setView(ll, Math.max(map.getZoom(), 15)); }
    }, e => { toast(e.code === 1 ? "Hai negato la posizione al browser" : "Posizione non trovata"); watchId = null; meBtn.getContainer().setAttribute("aria-pressed", "false"); },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  }
  const myPosition = () => new Promise((ok, no) => {
    if (!navigator.geolocation) return no(new Error("no"));
    navigator.geolocation.getCurrentPosition(p => ok({ lat: +p.coords.latitude.toFixed(5), lon: +p.coords.longitude.toFixed(5), name: "La mia posizione" }), no, { enableHighAccuracy: true, timeout: 20000 });
  });

  /* ---------- Partenza e arrivo ---------- */
  const shortName = x => x.name || String(x.display_name || "").split(",")[0] || "Posto scelto";
  function drawSlots() {
    for (const k of ["A", "B"]) {
      $("slot-" + k).classList.toggle("active", S.slot === k);
      if (S[k]) { $("q-" + k).value = S[k].name; $("clear-" + k).hidden = false; } else { $("clear-" + k).hidden = true; }
    }
  }
  function setSlot(k, p) {
    S[k] = p; S.savedId = null; S.route = null; layers.route.clearLayers();
    S.slot = k === "A" ? (S.B ? null : "B") : (S.A ? null : "A");
    $("res-" + k).hidden = true; drawSlots(); drawEnds(); drawResult(); routeIfReady();
  }
  function clearSlot(k) { S[k] = null; S.route = null; S.savedId = null; layers.route.clearLayers(); S.slot = k; $("q-" + k).value = ""; drawSlots(); drawEnds(); drawResult(); }
  function drawEnds() {
    layers.ends.clearLayers();
    for (const k of ["A", "B"]) if (S[k]) L.marker([S[k].lat, S[k].lon], { keyboard: false, icon: L.divIcon({ className: "mk", html: `<span class="pin ${k.toLowerCase()}">${k}</span>`, iconSize: [30, 30], iconAnchor: [15, 15] }) })
      .addTo(layers.ends).bindTooltip(S[k].name, { direction: "top", offset: [0, -14], className: "lbl" });
  }
  async function search(k, q) {
    const list = $("res-" + k); q = q.trim();
    if (!q) { list.hidden = true; return; }
    list.hidden = false; list.innerHTML = `<li class="meta">Cerco…</li>`;
    const b = map.getBounds(), vb = `${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}`;
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=it&viewbox=${vb}&q=${encodeURIComponent(q)}`);
      const rows = await r.json();
      if (!rows.length) { list.innerHTML = `<li class="meta">Nessun posto trovato con questo nome</li>`; return; }
      list._rows = rows;
      list.innerHTML = rows.map((x, i) => `<li><button type="button" class="res" data-k="${k}" data-i="${i}"><b>${esc(shortName(x))}</b><span>${esc(x.display_name)}</span></button></li>`).join("");
    } catch { list.innerHTML = `<li class="meta">Ricerca non riuscita: controlla la connessione</li>`; }
  }
  async function reverseName(k, ll) {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=it&zoom=17&lat=${ll.lat}&lon=${ll.lon}`);
      const x = await r.json();
      if (S[k] && S[k].lat === ll.lat && S[k].lon === ll.lon && x && (x.name || x.display_name)) { S[k].name = shortName(x); drawSlots(); drawEnds(); drawResult(); drawRoutes(); }
    } catch { /* il nome resta "lat, lon" */ }
  }

  /* ---------- Percorso ---------- */
  let routeToken = 0;
  async function routeIfReady() {
    if (!S.A || !S.B) return;
    const t = ++routeToken, m = MODES[S.mode];
    $("result").innerHTML = `<div class="card"><span class="meta">Calcolo il percorso…</span></div>`;
    try {
      const r = await fetch(`https://routing.openstreetmap.de/${m.osrm}/${S.A.lon},${S.A.lat};${S.B.lon},${S.B.lat}?overview=full&geometries=geojson`);
      const d = await r.json();
      if (t !== routeToken) return;
      if (d.code !== "Ok" || !d.routes || !d.routes[0]) { toast("Nessun percorso trovato tra questi due punti"); drawResult(); return; }
      const rt = d.routes[0];
      S.route = { coords: rt.geometry.coordinates.map(([lo, la]) => [+la.toFixed(5), +lo.toFixed(5)]), distance: Math.round(rt.distance), duration: Math.round(rt.duration) };
      drawRoute(true); drawResult();
    } catch { if (t === routeToken) { toast("Il calcolo del percorso non risponde: riprova tra poco"); drawResult(); } }
  }
  function drawRoute(fit) {
    layers.route.clearLayers(); if (!S.route) return;
    L.polyline(S.route.coords, { color: "#fff", weight: 10, opacity: .9 }).addTo(layers.route);
    L.polyline(S.route.coords, { color: "#B5634D", weight: 6 }).addTo(layers.route);
    if (fit) map.fitBounds(L.latLngBounds(S.route.coords), { padding: [40, 40] });
  }
  const ll = p => `${p.lat},${p.lon}`;
  const omUrl = (A, B, mode) => `https://omaps.app/route?sll=${ll(A)}&saddr=${encodeURIComponent(A.name)}&dll=${ll(B)}&daddr=${encodeURIComponent(B.name)}&type=${MODES[mode].om}`;
  const gmUrl = (A, B, mode) => `https://www.google.com/maps/dir/?api=1&origin=${ll(A)}&destination=${ll(B)}&travelmode=${MODES[mode].g}`;
  const pageUrl = () => location.origin + location.pathname;
  const routeLink = it => pageUrl() + "#r=" + [it.mode, it.name, it.A.lat, it.A.lon, it.A.name, it.B.lat, it.B.lon, it.B.name].map(v => encodeURIComponent(v)).join("|");
  const pointLink = p => pageUrl() + "#p=" + [p.cat, p.name, p.lat, p.lon].map(v => encodeURIComponent(v)).join("|");
  function drawResult() {
    const box = $("result"), r = S.route;
    if (!S.A || !S.B || !r) { box.innerHTML = ""; return; }
    const saved = S.savedId && S.routes.find(x => x.id === S.savedId), m = MODES[S.mode];
    box.innerHTML = `<div class="card stack">
      <div class="figs"><div class="fig"><span>Distanza</span><b>${esc(fmtKm(r.distance))}</b></div><div class="fig"><span>${esc(m.label)}</span><b>${esc(fmtMin(r.duration))}</b></div></div>
      <div class="field"><label for="rname">Nome del percorso</label><input class="input" id="rname" placeholder="es. Porto-Dune" value="${esc(saved ? saved.name : S.draftName)}"></div>
      <button class="btn primary wide" type="button" id="save-route">${saved ? "Salva il nuovo nome" : "Salva percorso"}</button>
      <div class="row">${saved ? `<span class="chip ok">Salvato</span>` : ""}<button class="btn small" type="button" id="copy-route">Copia link</button>
        <a class="btn small" href="${esc(omUrl(S.A, S.B, S.mode))}" target="_blank" rel="noopener">Organic Maps</a>
        <a class="btn small" href="${esc(gmUrl(S.A, S.B, S.mode))}" target="_blank" rel="noopener">Google Maps</a>
        <button class="btn small" type="button" id="new-route">Nuovo</button></div>
    </div>`;
  }
  function saveRoute() {
    const inp = $("rname"), name = inp.value.trim();
    if (!name) { toast("Scrivi un nome, per esempio Porto-Dune"); inp.focus(); return; }
    if (!S.route) return;
    let it = S.savedId && S.routes.find(x => x.id === S.savedId);
    if (it) it.name = name;
    else { it = { id: Date.now().toString(36), name, mode: S.mode, A: S.A, B: S.B, distance: S.route.distance, duration: S.route.duration, coords: S.route.coords, at: new Date().toISOString() }; S.routes.unshift(it); S.savedId = it.id; }
    LS.set("mappa-percorsi", S.routes); drawResult(); drawRoutes(); toast(`"${name}" salvato`);
  }
  function openRoute(it) {
    S.mode = it.mode; syncMode(); S.A = it.A; S.B = it.B; S.slot = null; S.savedId = it.id; S.draftName = "";
    S.route = { coords: it.coords, distance: it.duration === undefined ? 0 : it.distance, duration: it.duration };
    drawSlots(); drawEnds(); drawRoute(true); drawResult(); drawRoutes(); setTab("percorsi");
  }
  function newRoute() { S.A = null; S.B = null; S.route = null; S.savedId = null; S.draftName = ""; S.slot = "A"; layers.route.clearLayers(); $("q-A").value = ""; $("q-B").value = ""; drawSlots(); drawEnds(); drawResult(); drawRoutes(); $("q-A").focus(); }
  function drawRoutes() {
    $("routes-title").textContent = S.routes.length ? `I miei percorsi · ${S.routes.length}` : "I miei percorsi";
    $("routes").innerHTML = S.routes.length ? S.routes.map(it => `<article class="card item ${it.id === S.savedId ? "current" : ""}">
      <div class="stack" style="gap:0"><b>${esc(it.name)}</b><span class="meta">${esc((MODES[it.mode] || MODES.piedi).label)} · ${esc(fmtKm(it.distance))} · ${esc(fmtMin(it.duration))}</span><span class="meta">${esc(it.A.name)} → ${esc(it.B.name)}</span></div>
      <div class="row"><button class="btn small" type="button" data-open-r="${esc(it.id)}">Apri</button><button class="btn small" type="button" data-copy-r="${esc(it.id)}">Copia link</button><button class="btn small danger" type="button" data-del-r="${esc(it.id)}">Elimina</button></div>
    </article>`).join("") : `<p class="empty">Nessun percorso salvato. Scegli partenza e arrivo, poi dai un nome.</p>`;
  }
  function syncMode() { const sel = $("panel").querySelector("select[name=mezzo], select#mezzo, .tendina select"); if (sel && sel.value !== S.mode) { sel.value = S.mode; sel.dispatchEvent(new Event("change", { bubbles: true })); } }

  /* ---------- Punti ---------- */
  function drawPending() {
    layers.pending.clearLayers(); const p = S.pending; if (!p) return;
    L.marker([p.lat, p.lon], { keyboard: false, icon: L.divIcon({ className: "mk", html: `<span class="dot pending"></span>`, iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(layers.pending);
  }
  function drawPointForm() {
    const f = $("pt-form"), p = S.pending;
    if (!p) { f.innerHTML = ""; $("pt-hint").hidden = false; return; }
    $("pt-hint").hidden = true;
    f.innerHTML = `<div class="card stack">
      <div class="field"><label for="pname">Nome</label><input class="input" id="pname" placeholder="es. Mercatino del sabato" value="${esc(p.name)}"></div>
      <div class="field"><label for="pcat">Tipo</label><select class="input" id="pcat">${Object.entries(CATS).map(([v, l]) => `<option value="${v}" ${v === p.cat ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <button class="btn primary wide" type="button" id="save-point">Salva punto</button>
      <div class="row"><button class="btn small" type="button" id="cancel-point">Annulla</button></div>
    </div>`;
    tendine(f); $("pname").focus();
  }
  function savePoint() {
    const p = S.pending, name = $("pname").value.trim(), sel = $("pt-form").querySelector("select");
    if (!name) { toast("Scrivi il nome del punto"); $("pname").focus(); return; }
    S.points.unshift({ id: Date.now().toString(36), name, cat: CATS[sel.value] ? sel.value : "altro", lat: p.lat, lon: p.lon, at: new Date().toISOString() });
    LS.set("mappa-punti", S.points); S.pending = null; drawPending(); drawPointForm(); drawPoints(); toast(`"${name}" salvato`);
  }
  function drawPoints() {
    layers.points.clearLayers();
    S.points.forEach(p => L.marker([p.lat, p.lon], { keyboard: false, icon: L.divIcon({ className: "mk", html: `<span class="dot ${esc(CATS[p.cat] ? p.cat : "altro")}"></span>`, iconSize: [18, 18], iconAnchor: [9, 9] }) })
      .addTo(layers.points).bindTooltip(p.name, { permanent: true, direction: "top", offset: [0, -8], className: "lbl" }));
    $("points").innerHTML = S.points.length ? S.points.map(p => `<article class="card item">
      <div class="item-head"><span class="dot inline ${esc(CATS[p.cat] ? p.cat : "altro")}" aria-hidden="true"></span><div class="stack" style="gap:0;min-width:0"><b>${esc(p.name)}</b><span class="meta">${esc(CATS[p.cat] || "Altro")}</span></div></div>
      <div class="row"><button class="btn small" type="button" data-open-p="${esc(p.id)}">Apri</button><button class="btn small" type="button" data-copy-p="${esc(p.id)}">Copia link</button><button class="btn small danger" type="button" data-del-p="${esc(p.id)}">Elimina</button></div>
    </article>`).join("") : `<p class="empty">Nessun punto salvato.</p>`;
  }

  /* ---------- Schede, link, copia ---------- */
  function setTab(t) {
    S.tab = t;
    document.querySelectorAll(".tab").forEach(b => { if (b.dataset.tab === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    $("sec-percorsi").hidden = t !== "percorsi"; $("sec-punti").hidden = t !== "punti";
    if (t !== "punti" && S.pending) { S.pending = null; drawPending(); drawPointForm(); }
  }
  async function copy(text) {
    const box = $("linkbox");
    try { await navigator.clipboard.writeText(text); box.hidden = true; toast("Link copiato"); }
    catch { box.hidden = false; $("linkbox-in").value = text; $("linkbox-in").focus(); $("linkbox-in").select(); toast("Copia il link qui sotto"); }
  }
  function applyHash() {
    const h = location.hash.slice(1), i = h.indexOf("="); if (i < 0) return;
    const k = h.slice(0, i), parts = h.slice(i + 1).split("|").map(v => { try { return decodeURIComponent(v); } catch { return v; } });
    const num = v => { const n = Number(v); return Number.isFinite(n) && Math.abs(n) <= 180 ? n : null; };
    if (k === "r" && parts.length >= 8) {
      const [mode, name, alat, alon, aname, blat, blon, bname] = parts;
      if (!MODES[mode] || [alat, alon, blat, blon].some(v => num(v) === null)) return;
      const A = { lat: num(alat), lon: num(alon), name: aname || "Partenza" }, B = { lat: num(blat), lon: num(blon), name: bname || "Arrivo" };
      const same = S.routes.find(x => x.mode === mode && x.A.lat === A.lat && x.A.lon === A.lon && x.B.lat === B.lat && x.B.lon === B.lon);
      setTab("percorsi");
      if (same) { openRoute(same); return; }
      S.mode = mode; syncMode(); S.A = A; S.B = B; S.slot = null; S.savedId = null; S.draftName = name; S.route = null;
      drawSlots(); drawEnds(); drawResult(); routeIfReady();
    } else if (k === "p" && parts.length >= 4) {
      const [cat, name, lat, lon] = parts; if (num(lat) === null || num(lon) === null) return;
      setTab("punti"); map.setView([num(lat), num(lon)], Math.max(map.getZoom(), 16));
      const same = S.points.find(x => x.lat === num(lat) && x.lon === num(lon));
      if (same) return;
      S.pending = { lat: num(lat), lon: num(lon), name: name || "", cat: CATS[cat] ? cat : "altro" }; drawPending(); drawPointForm();
    }
  }

  /* ---------- Eventi ---------- */
  map.on("click", e => {
    const p = { lat: +e.latlng.lat.toFixed(5), lon: +e.latlng.lng.toFixed(5) };
    if (S.tab === "punti") { S.pending = { ...p, name: S.pending ? ($("pname") ? $("pname").value : "") : "", cat: S.pending ? S.pending.cat : "attivita" }; drawPending(); drawPointForm(); return; }
    if (!S.slot) { toast("Partenza e arrivo sono già scelti: tocca A o B per cambiarli"); return; }
    const k = S.slot; setSlot(k, { ...p, name: `${p.lat}, ${p.lon}` }); reverseName(k, p);
  });
  document.addEventListener("click", async e => {
    const el = e.target.closest("button, a"); if (!el) return;
    if (el.dataset.tab) { setTab(el.dataset.tab); return; }
    if (el.dataset.pick) { S.slot = el.dataset.pick; drawSlots(); toast(`Tocca la mappa per ${el.dataset.pick === "A" ? "la partenza" : "l'arrivo"}`); return; }
    if (el.dataset.clear) { clearSlot(el.dataset.clear); return; }
    if (el.classList.contains("res")) { const list = $("res-" + el.dataset.k), x = list._rows[Number(el.dataset.i)]; const p = { lat: +Number(x.lat).toFixed(5), lon: +Number(x.lon).toFixed(5), name: shortName(x) }; if (!S.A && !S.B) map.setView([p.lat, p.lon], 15); setSlot(el.dataset.k, p); return; }
    if (el.id === "gps-slot") { const k = S.slot || "A"; try { toast("Cerco la tua posizione…"); const p = await myPosition(); setSlot(k, p); if (!S.route) map.setView([p.lat, p.lon], Math.max(map.getZoom(), 15)); } catch { toast("Posizione non disponibile: controlla i permessi del browser"); } return; }
    if (el.id === "swap") { if (!S.A && !S.B) return; const a = S.A; S.A = S.B; S.B = a; S.savedId = null; S.route = null; layers.route.clearLayers(); drawSlots(); drawEnds(); drawResult(); routeIfReady(); return; }
    if (el.id === "save-route") { saveRoute(); return; }
    if (el.id === "new-route") { newRoute(); return; }
    if (el.id === "copy-route") { const name = ($("rname") && $("rname").value.trim()) || "Percorso"; copy(routeLink({ mode: S.mode, name, A: S.A, B: S.B })); return; }
    if (el.dataset.openR) { const it = S.routes.find(x => x.id === el.dataset.openR); if (it) openRoute(it); return; }
    if (el.dataset.copyR) { const it = S.routes.find(x => x.id === el.dataset.copyR); if (it) copy(routeLink(it)); return; }
    if (el.dataset.delR) { if (el.dataset.sure !== "1") { el.dataset.sure = "1"; el.textContent = "Sì, elimina"; return; }
      S.routes = S.routes.filter(x => x.id !== el.dataset.delR); if (S.savedId === el.dataset.delR) S.savedId = null; LS.set("mappa-percorsi", S.routes); drawRoutes(); drawResult(); toast("Percorso eliminato"); return; }
    if (el.id === "save-point") { savePoint(); return; }
    if (el.id === "cancel-point") { S.pending = null; drawPending(); drawPointForm(); return; }
    if (el.dataset.openP) { const p = S.points.find(x => x.id === el.dataset.openP); if (p) { map.setView([p.lat, p.lon], Math.max(map.getZoom(), 16)); } return; }
    if (el.dataset.copyP) { const p = S.points.find(x => x.id === el.dataset.copyP); if (p) copy(pointLink(p)); return; }
    if (el.dataset.delP) { if (el.dataset.sure !== "1") { el.dataset.sure = "1"; el.textContent = "Sì, elimina"; return; }
      S.points = S.points.filter(x => x.id !== el.dataset.delP); LS.set("mappa-punti", S.points); drawPoints(); toast("Punto eliminato"); return; }
    if (el.id === "fs") { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch { toast("Schermo intero non disponibile qui"); } }
  });
  document.addEventListener("fullscreenchange", () => setTimeout(() => map.invalidateSize(), 150));
  document.addEventListener("focusin", e => { const k = e.target.dataset && e.target.dataset.q; if (k && S.slot !== k && !S[k]) { S.slot = k; drawSlots(); } });
  document.addEventListener("keydown", e => {
    const k = e.target.dataset && e.target.dataset.q;
    if (k && e.key === "Enter") { e.preventDefault(); search(k, e.target.value); }
    else if (k && e.key === "Escape") { $("res-" + k).hidden = true; }
    else if (e.key === "Enter" && e.target.id === "rname") { e.preventDefault(); saveRoute(); }
    else if (e.key === "Enter" && e.target.id === "pname") { e.preventDefault(); savePoint(); }
  });
  document.addEventListener("change", e => {
    const sel = e.target;
    if (sel.tagName === "SELECT" && sel.closest("#sec-percorsi")) { if (MODES[sel.value] && sel.value !== S.mode) { S.mode = sel.value; LS.set("mappa-mezzo", S.mode); S.savedId = null; S.route = null; layers.route.clearLayers(); drawResult(); routeIfReady(); } }
  });
  window.addEventListener("hashchange", applyHash);

  /* ---------- Avvio ---------- */
  const mezzo = $("mezzo"); mezzo.value = S.mode; tendine($("sec-percorsi"));
  drawSlots(); drawRoutes(); drawPoints(); drawResult();
  applyHash();
})();
</script>
</body>
</html>
