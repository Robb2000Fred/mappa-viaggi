<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mappa Viaggi</title>
<meta name="description" content="La mia mappa per i viaggi: percorsi a tappe e posti preferiti.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#B5634D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mappa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 22s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z" fill="%23B5634D"/><circle cx="12" cy="10" r="2.6" fill="%23fff"/></svg>'>
<link rel="stylesheet" href="fonts/poppins.css">
<link rel="stylesheet" href="vendor/leaflet.min.css">
<style>
/* PC: pannello a sinistra e mappa a destra. Telefono: mappa a tutto schermo, barra fissa in basso con le tappe,
   pannello che sale dal basso. Palette del Taccuino di viaggio. */
:root {
  --bg: #F5F1EB; --surface: #FFFFFF; --ink: #3E3B36; --muted: #6F675D; --line: #E6DED2; --sand: #C7B8A2;
  --accent: #B5634D; --accent-ink: #FFFFFF; --accent-soft: #F4E4DD;
  --ok: #4C7A3C; --ok-soft: #E5EFDE; --alert: #A63D2F; --alert-soft: #F6DED8; --todo: #8A6A3E; --todo-soft: #F6E7CF;
  --f-body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-card: 16px; --bar: 118px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2A2825; --surface: #34312D; --ink: #F5F1EB; --muted: #C7B8A2; --line: #4A453F; --sand: #7E7363;
    --accent: #D79D76; --accent-ink: #2A2825; --accent-soft: #4A372F;
    --ok: #9BBF8A; --ok-soft: #313B2B; --alert: #E58C7A; --alert-soft: #48302A; --todo: #D9B98A; --todo-soft: #44392A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2A2825; --surface: #34312D; --ink: #F5F1EB; --muted: #C7B8A2; --line: #4A453F; --sand: #7E7363;
  --accent: #D79D76; --accent-ink: #2A2825; --accent-soft: #4A372F;
  --ok: #9BBF8A; --ok-soft: #313B2B; --alert: #E58C7A; --alert-soft: #48302A; --todo: #D9B98A; --todo-soft: #44392A; color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100%; scrollbar-gutter: stable; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; overflow: hidden; }
h1, h2 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 20px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.topbar { display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); background: var(--bg); min-width: 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.brand { font-weight: 600; font-size: 20px; white-space: nowrap; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { flex: none; width: 44px; height: 44px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; font-size: 18px; display: grid; place-items: center; }
.icon-btn:hover { border-color: var(--accent); }
.icon-btn svg, .bar-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.body { display: grid; grid-template-columns: 400px minmax(0, 1fr); min-height: 0; }
.panel { overflow-y: auto; display: grid; gap: 14px; align-content: start; min-width: 0; border-right: 1px solid var(--line); background: var(--bg);
  padding: 0 max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.sheet-head { display: none; }
.map-wrap { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--line); }
.bar { display: none; }

.search { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 14px 0 4px; display: grid; gap: 8px; }
.search-row { position: relative; }
.search-row .input { padding-left: 44px; padding-right: 44px; }
.search-row > svg { position: absolute; left: 14px; top: 50%; width: 20px; height: 20px; margin-top: -10px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.search-row .x { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; border: 0; background: transparent; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; min-width: 0; }
.stack { display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.meta { color: var(--muted); font-size: 14px; }
.empty { color: var(--muted); margin: 0; padding: 4px 0; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl-s { font-size: 13px; color: var(--muted); font-weight: 600; }
.input { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.input:focus { border-color: var(--accent); outline: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 24px; font-size: 17px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.wide { width: 100%; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: 15px; }
.btn.danger { color: var(--alert); }
.chip { display: inline-flex; align-items: center; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.err { background: var(--alert-soft); color: var(--alert); }
.x { width: 44px; height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; color: var(--muted); font-size: 18px; }
.x:hover { border-color: var(--accent); color: var(--accent); }
.code { font-family: ui-monospace, Consolas, monospace; font-size: 15px; letter-spacing: .04em; overflow-wrap: anywhere; }

/* Tappe (A, B, C…) */
.stops { display: grid; gap: 4px; }
.slot { display: grid; grid-template-columns: 40px minmax(0, 1fr) 44px; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 14px; border: 1.5px solid transparent; }
.slot.active { border-color: var(--accent); background: var(--accent-soft); }
.slot .name { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
.slot .name.ph { color: var(--muted); font-weight: 400; }
.badge { display: inline-grid; place-items: center; padding: 0; line-height: 1; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.badge.empty { background: var(--surface); color: var(--muted); border: 2px dashed var(--muted); box-shadow: none; }
.results { list-style: none; margin: 0; padding: 6px; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--surface); display: grid; gap: 2px; }
.results li.meta { padding: 8px 10px; }
.res { all: unset; box-sizing: border-box; display: grid; width: 100%; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.res:hover, .res:focus-visible { background: var(--accent-soft); outline: none; }
.muted { color: var(--muted); font-weight: 400; }
.res span { font-size: 13px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.figs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fig { display: grid; gap: 2px; padding: 12px 16px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
.fig b { font-size: 28px; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; }
.fig span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.item { display: grid; gap: 10px; }
.item.current { border-color: var(--accent); }
.item-head { display: flex; gap: 12px; align-items: center; min-width: 0; }
.item b { overflow-wrap: anywhere; }
.linkbox { font-size: 13px; }
.sec-title { display: flex; align-items: baseline; gap: 8px; }
.sec-title .meta { font-weight: 500; }

/* Icone e colori dei preferiti */
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.ico { width: 100%; aspect-ratio: 1; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.ico svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico:hover { border-color: var(--accent); }
.ico[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.swatch-row { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 2px var(--surface); }
.sw[aria-checked="true"] { border-color: var(--ink); }
.fav-dot { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.fav-dot svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Tendina rotonda (stile-fred) */
.tendina { position: relative; }
.tendina select { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.tendina-box { width: 100%; min-height: 46px; padding: 10px 44px 10px 16px; border-radius: 16px; border: 1.5px solid var(--line);
  background: var(--surface); text-align: left; cursor: pointer; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tendina-box::after { content: ""; position: absolute; right: 18px; top: 50%; width: 8px; height: 8px; margin-top: -6px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
.tendina-box:hover, .tendina.aperta .tendina-box { border-color: var(--accent); }
.tendina.aperta .tendina-box { border-radius: 16px 16px 0 0; border-bottom-color: var(--line); }
.tendina.aperta .tendina-box::after { transform: rotate(225deg); margin-top: -2px; }
.tendina-lista { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin: 0; padding: 6px; list-style: none;
  background: var(--surface); border: 1.5px solid var(--accent); border-top: 0; border-radius: 0 0 16px 16px;
  box-shadow: 0 14px 30px rgba(40, 25, 15, .18); max-height: 280px; overflow-y: auto; }
.tendina-lista li { padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.tendina-lista li:hover, .tendina-lista li.attiva { background: var(--accent-soft); }
.tendina-lista li[aria-selected="true"] { color: var(--accent); font-weight: 600; }

/* Calendario in finestra */
dialog { border: 0; border-radius: 20px; padding: 0; background: var(--surface); color: var(--ink); max-width: min(92vw, 380px); width: 100%; box-shadow: 0 24px 60px rgba(0, 0, 0, .3); }
dialog::backdrop { background: rgba(30, 20, 10, .55); }
.cal { padding: 18px; display: grid; gap: 12px; }
.cal-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 6px; }
.cal-head b { text-align: center; font-size: 17px; text-transform: capitalize; }
.cal-nav { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-grid .wd { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 0; }
.day { min-height: 44px; border-radius: 10px; border: 1.5px solid transparent; background: transparent; cursor: pointer; font-weight: 500; }
.day:hover { border-color: var(--accent); }
.day.out { color: var(--muted); opacity: .5; }
.day.today { border-color: var(--line); }
.day[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Sulla mappa */
.mk { background: none; border: 0; }
.mk-wrap { position: relative; display: block; width: 30px; height: 30px; }
.pin { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: #fff; font: 700 14px var(--f-body); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
.rlabel, .flabel { position: absolute; left: 36px; top: 50%; transform: translateY(-50%); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font: 600 13px/1.2 var(--f-body); background: #F5F1EB; color: #3E3B36; border: 1.5px solid #3E3B36; border-radius: 8px; padding: 3px 8px; box-shadow: 0 1px 4px rgba(0, 0, 0, .2); }
.rdate { display: inline-grid; justify-items: center; line-height: 1; padding: 3px 6px; border-radius: 6px; background: #B5634D; color: #fff; margin: -2px -4px -2px 0; }
.rdate b { font-size: 14px; font-weight: 700; }
.rdate span { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.fpin { display: grid; place-items: center; width: 34px; height: 34px; margin: -2px; border-radius: 50%; color: #fff; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
.fpin svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.dot { display: block; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); background: #3E3B36; }
.dot.pending { background: #fff; border: 3px dashed #3E3B36; }
.leaflet-tooltip.lbl { font: 600 13px var(--f-body); background: #F5F1EB; color: #3E3B36; border: 1.5px solid #3E3B36; border-radius: 8px; padding: 3px 8px; box-shadow: none; }
.leaflet-tooltip.lbl::before { display: none; }
.leaflet-container { font-family: var(--f-body); }
.leaflet-bar a, .leaflet-touch .leaflet-bar a { width: 44px; height: 44px; line-height: 44px; font-size: 20px; }
.map-btn { min-width: 44px; height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 15px var(--f-body); cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .18); display: inline-flex; align-items: center; gap: 6px; }
.map-btn:hover { border-color: var(--accent); }
.map-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.map-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .leaflet-layer.osm { filter: brightness(.82) contrast(1.05); } }
:root[data-theme="dark"] .leaflet-layer.osm { filter: brightness(.82) contrast(1.05); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 2000;
  background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-weight: 600; max-width: calc(100% - 32px); }

/* ---------- Telefono ---------- */
@media (max-width: 760px) {
  .topbar { display: none; }
  .cal { padding: 12px; } .cal-grid { gap: 2px; }
  .app { display: block; }
  .body { display: block; }
  .map-wrap { position: fixed; inset: 0 0 calc(var(--bar) + env(safe-area-inset-bottom, 0px)) 0; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; top: 10vh; z-index: 30; border: 0; border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .25);
    transform: translateY(105%); transition: transform .25s ease; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .panel.open { transform: none; }
  .sheet-head { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 11; background: var(--bg); padding: 12px 0 2px; }
  .sheet-head b { flex: 1; font-size: 18px; }
  .sheet-head::before { content: ""; position: absolute; top: 6px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--sand); }
  .search { position: static; padding-top: 6px; }
  .bar { display: grid; gap: 8px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: calc(var(--bar) + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line);
    padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
  .bar-info { display: flex; align-items: center; gap: 10px; min-height: 44px; min-width: 0; }
  .bar-info .txt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
  .bar-info .txt.muted { color: var(--muted); font-weight: 400; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .chips { flex: 1; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips .badge { flex: none; width: 44px; height: 44px; }
  .chips .badge.active { box-shadow: 0 0 0 3px var(--accent); }
  .bar-btn { flex: none; width: 48px; height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
  .bar-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  #float { position: fixed; left: 12px; right: 12px; bottom: calc(var(--bar) + 12px + env(safe-area-inset-bottom, 0px)); z-index: 15; }
  #float:empty { display: none; }
  .leaflet-top.leaflet-right { top: env(safe-area-inset-top, 0px); }
  .leaflet-top.leaflet-left { top: env(safe-area-inset-top, 0px); }
  .toast { bottom: calc(var(--bar) + 16px + env(safe-area-inset-bottom, 0px)); }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <b class="brand">Mappa Viaggi</b>
    <button class="icon-btn" type="button" id="fs" aria-label="Schermo intero" title="Schermo intero">⛶</button>
  </header>
  <div class="body">
    <aside class="panel" id="panel">
      <div class="sheet-head"><b id="sheet-title">Mappa Viaggi</b><button class="x" type="button" id="sheet-close" aria-label="Chiudi">✕</button></div>
      <div class="search">
        <div class="search-row">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" id="q" placeholder="Cerca un posto" aria-label="Cerca un posto" autocomplete="off">
          <button class="x" type="button" id="q-clear" aria-label="Cancella la ricerca" hidden>✕</button>
        </div>
        <ul class="results" id="res" hidden></ul>
      </div>
      <div id="pick-home"><div id="pick"></div></div>
      <div id="favform"></div>
      <button class="btn small" type="button" id="new-route">＋ Nuovo percorso</button>
      <div class="field"><label for="mezzo">Come</label>
        <select class="input" id="mezzo"><option value="piedi">A piedi</option><option value="bici">In bici</option><option value="auto">In auto</option></select></div>
      <div class="stops" id="stops"></div>
      <div class="row"><button class="btn small" type="button" id="gps-slot">La mia posizione</button><button class="btn small" type="button" id="swap">⇄ Inverti</button></div>
      <div id="result"></div>
      <div class="sec-title"><h2>Percorsi</h2><span class="meta" id="routes-n"></span></div>
      <div id="routes" class="stack"></div>
      <div class="sec-title"><h2>Preferiti</h2><span class="meta" id="favs-n"></span></div>
      <div id="favs" class="stack"></div>
      <div class="sec-title"><h2>Sincronizzazione</h2></div>
      <div id="sync"></div>
      <div id="linkbox" class="field" hidden><label for="linkbox-in">Link da copiare</label><input class="input linkbox" id="linkbox-in" readonly></div>
    </aside>
    <div class="map-wrap"><div id="map" aria-label="Mappa"></div></div>
  </div>
</div>
<div id="float"></div>
<nav class="bar" aria-label="Percorso">
  <div class="bar-info" id="bar-info"></div>
  <div class="bar-row">
    <div class="chips" id="chips" role="group" aria-label="Tappe"></div>
    <button class="bar-btn" type="button" id="bar-new" aria-label="Nuovo percorso" title="Nuovo percorso"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="bar-btn" type="button" id="bar-search" aria-label="Cerca un posto"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>

  let typeTimer = null;

  async function reverseName(obj) {

      <div class="row"><button class="btn small primary" type="button" id="pick-stop">${esc(lbl)}</button>${isFav ? "" : `<button class="btn small" type="button" id="pick-fav">★ Preferito</button>`}</div></div>`;
  }

  /* ---------- Tappe ---------- */
  function drawStops() {
    const n = S.pts.length, rows = [];
    for (let i = 0; i <= Math.min(n, 25); i++) {
      const p = S.pts[i], filled = !!p, active = S.slot === i;
      rows.push(`<div class="slot ${active ? "active" : ""}">
        <button class="badge ${filled ? "" : "empty"}" type="button" data-pick="${i}" style="${filled ? `background:${stopColor(i, n)}` : ""}" aria-label="${filled ? `Tappa ${LET[i]}: tocca per spostarla` : `Prossima tappa ${LET[i]}`}" aria-pressed="${active}">${LET[i]}</button>
        <div class="stack" style="gap:0"><span class="lbl-s">${i === 0 ? "Partenza" : filled && i === n - 1 ? "Arrivo" : filled ? "Tappa" : n < 2 ? "Arrivo" : "Altra tappa"}</span>
          <span class="name ${filled ? "" : "ph"}">${filled ? esc(p.name) : "Tocca un punto sulla mappa o cerca un posto"}</span></div>
        ${filled ? `<button class="x" type="button" data-clear="${i}" aria-label="Togli la tappa ${LET[i]}">✕</button>` : "<span></span>"}
      </div>`);
    }

  }
  function setStop(i, p) {

    if (i >= S.pts.length) S.pts.push(pt); else S.pts[i] = pt;
    S.savedId = null; S.route = null; layers.route.clearLayers(); S.slot = null;
    S.pick = p.auto ? Object.assign(pt, { stop: Math.min(i, S.pts.length - 1) }) : null; drawPick();
    drawStops(); drawEnds(); drawResult(); drawRoutes(); drawSaved(); drawBar(); routeIfReady();
    if (pt.auto) reverseName(pt);
  }
  function clearStop(i) { S.pts.splice(i, 1); S.pick = null; drawPick(); S.route = null; S.savedId = null; layers.route.clearLayers(); S.slot = null; drawStops(); drawEnds(); drawResult(); drawRoutes(); drawSaved(); drawBar(); routeIfReady(); }
  const pinHtml = (i, n, name, date) => `<span class="mk-wrap"><span class="pin" style="background:${stopColor(i, n)}">${LET[i]}</span>${name ? `<span class="rlabel">${esc(name)}${date ? dateBlock(date) : ""}</span>` : ""}</span>`;
  function drawEnds() {
    layers.ends.clearLayers();
    const saved = S.savedId && S.routes.find(x => x.id === S.savedId), n = S.pts.length;
    S.pts.forEach((p, i) => mk(p, pinHtml(i, n, i === 0 && saved ? saved.name : "", i === 0 && saved && saved.date), 30, { zIndexOffset: 1000 }).addTo(layers.ends));
  }

  /* ---------- Percorso ---------- */
  let routeToken = 0;
  async function routeIfReady() {
    const t = ++routeToken, m = MODES[S.mode];

    try {
      const r = await fetch(`https://routing.openstreetmap.de/${m.osrm}/${S.pts.map(p => `${p.lon},${p.lat}`).join(";")}?overview=full&geometries=geojson`);
      const d = await r.json();
      if (t !== routeToken) return;
      if (d.code !== "Ok" || !d.routes || !d.routes[0]) { toast("Nessun percorso trovato tra questi punti"); drawResult(); drawBar(); return; }
      const rt = d.routes[0];
      S.route = { coords: rt.geometry.coordinates.map(([lo, la]) => [+la.toFixed(5), +lo.toFixed(5)]), distance: Math.round(rt.distance), duration: Math.round(rt.duration) };
      drawRoute(true); drawResult(); drawBar();
    } catch { if (t === routeToken) { toast("Il calcolo del percorso non risponde: riprova tra poco"); drawResult(); drawBar(); } }
  }
  function drawRoute(fit) {
    layers.route.clearLayers(); if (!S.route || !Array.isArray(S.route.coords) || S.route.coords.length < 2) return;

    L.polyline(S.route.coords, { color: "#B5634D", weight: 6 }).addTo(layers.route);

  function drawSaved() {

  const pageUrl = () => location.origin + location.pathname;
  const routeLink = it => pageUrl() + "#r=" + [it.mode, it.name, it.date || "", ...it.pts.map(p => [p.lat, p.lon, p.name].map(v => encodeURIComponent(v)).join(","))].map((v, i) => i < 3 ? encodeURIComponent(v) : v).join("|");
  function drawResult() {

    if (S.pts.length < 2 || !r) { box.innerHTML = ""; return; }

    box.innerHTML = `<div class="card stack">
      <div class="figs"><div class="fig"><span>Distanza</span><b>${esc(fmtKm(r.distance))}</b></div><div class="fig"><span>${esc(m.label)}</span><b>${esc(fmtMin(r.duration))}</b></div></div>
      <div class="field"><label for="rname">Nome del percorso</label><input class="input" id="rname" placeholder="es. Porto-Dune" value="${esc(S.draftName ?? (saved ? saved.name : ""))}"></div>

  function saveRoute() {

  }
  function openRoute(it) {

  }
  function newRoute() { routeToken++; S.pts = []; S.route = null; S.savedId = null; S.draftName = null; S.pendingDate = ""; S.slot = null; S.pick = null; drawPick(); layers.route.clearLayers(); drawStops(); drawEnds(); drawResult(); drawRoutes(); drawSaved(); drawBar(); if (isMobile()) closeSheet(); toast("Tocca un punto sulla mappa e scegli A"); }
  function drawRoutes() {

  function syncMode() { const sel = document.querySelector("#panel .tendina select"); if (sel && sel.value !== S.mode) { sel.value = S.mode; sel.dispatchEvent(new Event("change", { bubbles: true })); } }

  /* ---------- Barra in basso (telefono) ---------- */
  // Quello che stai facendo (tappe, percorso, nome, ricerca) resta salvato: se il telefono ricarica la pagina la ritrovi com'era.
  function saveDraft() {
    LS.set("mappa-bozza", { pts: S.pts.map(p => ({ lat: p.lat, lon: p.lon, name: p.name, auto: !!p.auto })), route: S.route, savedId: S.savedId,
      draftName: S.draftName, pendingDate: S.pendingDate, q: ($("q") && $("q").value) || "" });
  }
  function loadDraft() {

    if (Array.isArray(d.pts) && d.pts.length <= 26 && d.pts.every(okPt)) S.pts = d.pts.map(p => ({ lat: p.lat, lon: p.lon, name: String(p.name ?? ""), auto: !!p.auto }));

  /* ---------- Calendario ---------- */

      cells.push(`<button class="day ${out ? "out" : ""} ${iso === today ? "today" : ""}" type="button" data-iso="${iso}" aria-pressed="${iso === it.date}" aria-label="${esc(fmtDay(iso))}">${d.getDate()}</button>`);
    }

  /* ---------- Sincronizzazione tra dispositivi (Supabase) ---------- */
  const syncOn = () => !!(SYNC.url && SYNC.key);
  async function rpc(fn, body) {
    const r = await fetch(`${SYNC.url}/rest/v1/rpc/${fn}`, { method: "POST", headers: { "Content-Type": "application/json", apikey: SYNC.key, Authorization: `Bearer ${SYNC.key}` }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  }
  // JSON "canonico": chiavi ordinate a ogni livello, così due copie uguali dello stesso oggetto (una dal browser, una da Supabase) danno lo stesso testo.
  const canon = v => Array.isArray(v) ? "[" + v.map(canon).join(",") + "]" : v && typeof v === "object" ? "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}" : JSON.stringify(v ?? null);
  // Stessa regola di spareggio della funzione SQL unisci: mod maggiore, poi campo per campo (name, at, date, icon, color, mode, distance, duration, lat, lon, pts, coords).
  const TIE = ["mod", "name", "at", "date", "icon", "color", "mode", "distance", "duration", "lat", "lon"];
  const tv = (o, k) => o[k] === undefined || o[k] === null ? "" : (k === "pts" || k === "coords") ? JSON.stringify(o[k]) : String(o[k]);
  const wins = (x, c) => { for (const k of [...TIE, "pts", "coords"]) { const a = tv(x, k), b = tv(c, k); if (a !== b) return a > b; } return false; };
  function merge(a, b) {
    const d = { ...(a.del || {}) };
    for (const [k, v] of Object.entries(b.del || {})) if (!d[k] || v > d[k]) d[k] = v;
    const del = Object.fromEntries(Object.keys(d).sort().map(k => [k, d[k]]));
    const pick = (xs, ys) => { const m = new Map(); [...(xs || []), ...(ys || [])].map(upgrade).forEach(x => { if (del[x.id] && del[x.id] >= x.mod) return; const cur = m.get(x.id); if (!cur || wins(x, cur)) m.set(x.id, x); }); return [...m.values()].sort((p, q) => (q.at || "").localeCompare(p.at || "") || String(p.id).localeCompare(String(q.id))); };
    return { v: 1, routes: pick(a.routes, b.routes), favs: pick(a.favs, b.favs), del };
  }
  // dirty: ci sono modifiche locali non ancora mandate. conn: cambia a ogni collega/scollega, così una risposta vecchia viene scartata.
  let pulling = false, pushTimer = null, dirty = false, conn = 0;
  async function pull() {
    if (!syncOn() || !S.codice || navigator.onLine === false) return;
    if (pulling) { dirty = true; return; }
    const codice = S.codice, gen = conn;
    pulling = true; dirty = false; S.syncState = "…"; drawSync();
    try {
      const remote = (await rpc("leggi", { codice })) || {};
      if (gen !== conn) return;
      let merged = merge({ routes: S.routes, favs: S.favs, del: S.del }, remote);
      if (canon(merged) !== canon(merge(remote, {}))) {
        const res = await rpc("scrivi", { codice, dati: merged });
        if (gen !== conn) return;
        if (res && typeof res === "object" && res.routes) merged = res; // il database unisce e restituisce il risultato
      }
      // Unione con lo stato ATTUALE (non con l'istantanea inviata): una modifica fatta nel frattempo resta, ed è ancora "dirty".
      merged = merge({ routes: S.routes, favs: S.favs, del: S.del }, merged);
      S.routes = merged.routes; S.favs = merged.favs; S.del = merged.del; const wasDirty = dirty, saved = persist(); dirty = wasDirty;
      S.syncState = saved ? "ok" : "nosave"; S.syncAt = new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
      if (!saved) toast(NO_SAVE);
      if (S.savedId && !S.routes.find(x => x.id === S.savedId)) S.savedId = null;
      drawRoutes(); drawFavs(); drawSaved(); drawEnds(); drawResult(); drawBar();
    } catch { if (gen === conn) S.syncState = "err"; }
    finally { pulling = false; drawSync(); if (S.codice && (dirty || gen !== conn)) push(); }
  }
  function push() { if (!syncOn() || !S.codice) return; clearTimeout(pushTimer); pushTimer = setTimeout(pull, 700); }
  const makeCodice = () => { const a = "abcdefghjkmnpqrstuvwxyz23456789", b = new Uint8Array(20); crypto.getRandomValues(b); const s = [...b].map(x => a[x % a.length]).join(""); return `${s.slice(0, 5)}-${s.slice(5, 10)}-${s.slice(10, 15)}-${s.slice(15, 20)}`; };
  function drawSync() {
    const box = $("sync");
    if (!syncOn()) { box.innerHTML = `<p class="empty">Non ancora attiva: ogni dispositivo tiene i suoi percorsi.</p>`; return; }
    if (!S.codice) {
      box.innerHTML = `<div class="card stack"><span class="meta">Un codice famiglia collega i tuoi dispositivi: crealo qui, poi scrivilo sugli altri.</span>
        <button class="btn primary wide" type="button" id="sync-new">Crea un codice nuovo</button>
        <div class="field"><label for="sync-in">Ho già un codice</label><input class="input code" id="sync-in" placeholder="xxxxx-xxxxx-xxxxx-xxxxx" autocomplete="off" autocapitalize="off"></div>
        <button class="btn wide" type="button" id="sync-join">Collega con questo codice</button></div>`;
      return;
    }
    const st = S.syncState === "ok" ? `<span class="chip ok">Sincronizzato${S.syncAt ? ` · ${esc(S.syncAt)}` : ""}</span>` : S.syncState === "err" ? `<span class="chip err">Non raggiungibile</span>` : S.syncState === "nosave" ? `<span class="chip err">Scaricato, ma non salvato sul dispositivo</span>` : `<span class="meta">Sincronizzo…</span>`;
    box.innerHTML = `<div class="card stack"><span class="lbl-s">Codice famiglia</span><b class="code">${esc(S.codice)}</b>
      <div class="row">${st}<button class="btn small" type="button" id="sync-copy">Copia</button><button class="btn small" type="button" id="sync-now">Aggiorna</button><button class="btn small danger" type="button" id="sync-off">Scollega</button></div></div>`;
  }
  function setCodice(c) {
    if (!(c ? LS.set("mappa-codice", c) : LS.del("mappa-codice"))) { toast(c ? "Codice non salvato sul dispositivo: la memoria del browser è piena o bloccata" : "Non riesco a scollegare: la memoria del browser è bloccata"); return false; }
    conn++; clearTimeout(pushTimer); S.codice = c; S.syncState = ""; S.syncAt = ""; drawSync(); if (c) { dirty = true; pull(); }
    return true;
  }

  /* ---------- Link e copia ---------- */
  async function copy(text) {
    const box = $("linkbox");
    try { await navigator.clipboard.writeText(text); box.hidden = true; toast("Copiato"); }
    catch { box.hidden = false; $("linkbox-in").value = text; $("linkbox-in").focus(); $("linkbox-in").select(); toast("Copia il testo qui sotto"); }
  }
  function applyHash() {
    const h = location.hash.slice(1), i = h.indexOf("="); if (i < 0) return;
    const k = h.slice(0, i), parts = h.slice(i + 1).split("|");
    const dec = v => { try { return decodeURIComponent(v); } catch { return v; } };
    if (k === "q") { // "#q=Grotta di Nettuno": cerco quel nome; tappe e percorso in corso non si toccano
      const text = dec(h.slice(i + 1)).trim().slice(0, 200); history.replaceState(null, "", location.pathname + location.search);
      if (!text) return;
      $("q").value = text; $("q-clear").hidden = false; saveDraft();
      if (isMobile()) openSheet("Cerca"); search(text); return;
    }
    const num = v => { const n = Number(v); return v !== "" && Number.isFinite(n) && Math.abs(n) <= 180 ? n : null; };
    if (k === "r" && parts.length >= 5) {
      const [mode, name, date] = parts.slice(0, 3).map(dec);
      const pts = parts.slice(3).map(s => { const [la, lo, nm] = s.split(",").map(dec); return { lat: num(la), lon: num(lo), name: nm || "Tappa" }; });
      if (!MODES[mode] || pts.length > 26 || pts.some(p => p.lat === null || p.lon === null)) return;
      const same = S.routes.find(x => x.mode === mode && (x.name || "") === name && (x.date || "") === (isoOk(date) ? date : "") && x.pts.length === pts.length
        && x.pts.every((p, j) => p.lat === pts[j].lat && p.lon === pts[j].lon && String(p.name ?? "") === pts[j].name));
      if (same) { openRoute(same); return; }
      routeToken++; S.pick = null; drawPick(); layers.route.clearLayers();
      S.mode = mode; syncMode(); S.pts = pts; S.slot = null; S.savedId = null; S.draftName = name; S.route = null; S.pendingDate = isoOk(date) ? date : "";
      drawStops(); drawEnds(); drawResult(); drawBar(); routeIfReady();
    } else if (k === "f" && parts.length >= 5) {
      const [icon, color, name, lat, lon] = parts.map(dec); if (num(lat) === null || num(lon) === null) return;
      map.setView([num(lat), num(lon)], Math.max(map.getZoom(), 16));
      if (S.favs.find(x => x.lat === num(lat) && x.lon === num(lon))) return;
      S.favForm = { lat: num(lat), lon: num(lon), name: name || "", icon: okIcon(icon), color: okColor(color) }; drawFavForm();
    }
  }

  /* ---------- Eventi ---------- */
  // Tocco sulla mappa: non diventa subito una tappa. Compare la scelta "Tappa A" / "★ Preferito" / ✕, così un tocco per sbaglio non sporca il percorso.
  map.on("click", e => {
    const p = { lat: +e.latlng.lat.toFixed(5), lon: +e.latlng.lng.toFixed(5) };
    const pick = { ...p, name: `${p.lat}, ${p.lon}`, auto: true };
    setPick(pick); reverseName(pick);
  });
  document.addEventListener("click", async e => {
    const el = e.target.closest("button, a"); if (!el) return;
    if (el.dataset.pick !== undefined) { const i = Number(el.dataset.pick); if (i >= S.pts.length) { toast(`Tocca un punto sulla mappa e scegli ${LET[i]}`); if (isMobile()) closeSheet(); return; } S.slot = S.slot === i ? null : i; S.pick = null; drawPick(); drawStops(); drawBar(); if (S.slot !== null) { if (isMobile()) closeSheet(); toast(`Tocca la mappa per spostare ${LET[i]}`); } return; }
    if (el.dataset.clear !== undefined) { clearStop(Number(el.dataset.clear)); return; }
    if (el.id === "bar-cancel") { S.slot = null; drawStops(); drawBar(); return; }
    if (el.id === "bar-save") { openSheet("Percorso", "rname"); return; }
    if (el.id === "bar-new") { newRoute(); return; }
    if (el.id === "bar-search") { openSheet("Cerca", "q"); return; }
    if (el.id === "bar-menu") { openSheet("Mappa Viaggi"); return; }
    if (el.id === "sheet-close") { closeSheet(); return; }
    if (el.classList.contains("res")) { const x = $("res")._rows[Number(el.dataset.i)]; const p = { lat: +Number(x.lat).toFixed(5), lon: +Number(x.lon).toFixed(5), name: shortName(x) }; $("res").hidden = true; map.setView([p.lat, p.lon], Math.max(map.getZoom(), 15)); setPick(p); return; }
    if (el.id === "q-clear") { $("q").value = ""; $("res").hidden = true; el.hidden = true; saveDraft(); $("q").focus(); return; }
    if (el.id === "pick-stop") { if (setStop(S.slot ?? S.pts.length, S.pick) !== false) { S.pick = null; drawPick(); } return; } // scelta fatta: la schedina si chiude, il tocco dopo propone la lettera successiva
    if (el.id === "pick-fav") { const p = S.pick; if (p.stop !== undefined) S.pts.splice(p.stop, 1); S.favForm = { lat: p.lat, lon: p.lon, name: p.auto ? "" : p.name, icon: "stella", color: COLORS[0] }; S.pick = null; drawPick(); if (p.stop !== undefined) { S.route = null; S.savedId = null; layers.route.clearLayers(); drawStops(); drawEnds(); drawResult(); drawRoutes(); drawSaved(); drawBar(); routeIfReady(); } drawFavForm(); return; }
    if (el.id === "pick-del") { clearStop(S.pick.stop); return; }
    if (el.id === "pick-x") { S.pick = null; drawPick(); return; }
    if (el.id === "gps-slot") { try { toast("Cerco la tua posizione…"); const p = await myPosition(); if (S.slot !== null) setStop(S.slot, p); else { map.setView([p.lat, p.lon], Math.max(map.getZoom(), 15)); setPick(p); } toast(p.acc > 500 ? `Posizione approssimativa (${accText(p.acc)}): su PC viene dalla rete, non dal GPS` : `Precisione ${accText(p.acc)}`); } catch { toast("Posizione non disponibile: controlla i permessi del browser"); } return; }
    if (el.id === "swap") { if (S.pts.length < 2) return; S.pts.reverse(); S.savedId = null; S.route = null; S.pick = null; drawPick(); layers.route.clearLayers(); drawStops(); drawEnds(); drawResult(); drawRoutes(); drawSaved(); drawBar(); routeIfReady(); return; }
    if (el.id === "save-route") { saveRoute(); return; }
    if (el.id === "new-route") { newRoute(); return; }
    if (el.id === "copy-route") { const it = S.routes.find(x => x.id === S.savedId); if (it) copy(routeLink(it)); return; }
    if (el.dataset.openR) { const it = S.routes.find(x => x.id === el.dataset.openR); if (it) openRoute(it); return; }
    if (el.dataset.linkR) { openCal(el.dataset.linkR); return; }
    if (el.dataset.delR) { if (el.dataset.sure !== "1") { el.dataset.sure = "1"; el.textContent = "Sì, elimina"; return; }
      const id = el.dataset.delR, keep = S.routes, sid = S.savedId; S.routes = S.routes.filter(x => x.id !== id); S.del[id] = now(); if (S.savedId === id) S.savedId = null;
      if (!persist()) { S.routes = keep; delete S.del[id]; S.savedId = sid; drawRoutes(); toast(NO_SAVE); return; }
      push(); drawRoutes(); drawResult(); drawEnds(); drawSaved(); drawBar(); toast("Percorso eliminato"); return; }
    if (el.dataset.cal) { S.cal.m += Number(el.dataset.cal); if (S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } if (S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } drawCal(); return; }
    if (el.dataset.iso) { setDate(S.cal.id, el.dataset.iso); return; }
    if (el.id === "cal-none") { setDate(S.cal.id, ""); return; }
    if (el.id === "cal-close") { $("cal").close(); S.cal = null; return; }
    if (el.dataset.ico) { S.favForm.icon = el.dataset.ico; el.parentElement.querySelectorAll(".ico").forEach(b => b.setAttribute("aria-checked", b === el)); return; }
    if (el.dataset.col) { S.favForm.color = el.dataset.col; el.parentElement.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-checked", b === el)); return; }
    if (el.id === "save-fav") { saveFav(); return; }
    if (el.id === "cancel-fav") { S.favForm = null; drawFavForm(); if (isMobile()) closeSheet(); return; }
    if (el.dataset.openF) { const f = S.favs.find(x => x.id === el.dataset.openF); if (f) { map.setView([f.lat, f.lon], Math.max(map.getZoom(), 16)); setPick({ lat: f.lat, lon: f.lon, name: f.name }); } return; }
    if (el.dataset.editF) { const f = S.favs.find(x => x.id === el.dataset.editF); if (f) { S.favForm = { ...f }; S.pick = null; drawPick(); drawFavForm(); map.setView([f.lat, f.lon], Math.max(map.getZoom(), 15)); } return; }
    if (el.dataset.delF) { if (el.dataset.sure !== "1") { el.dataset.sure = "1"; el.textContent = "Sì, elimina"; return; }
      const id = el.dataset.delF, keep = S.favs; S.favs = S.favs.filter(x => x.id !== id); S.del[id] = now();
      if (!persist()) { S.favs = keep; delete S.del[id]; drawFavs(); toast(NO_SAVE); return; }
      push(); drawFavs(); toast("Posto eliminato"); return; }
    if (el.id === "sync-new") { if (setCodice(makeCodice())) toast("Codice creato: scrivilo sugli altri dispositivi"); return; }
    if (el.id === "sync-join") { const c = $("sync-in").value.trim().toLowerCase(); if (c.length < 20) { toast("Il codice è di 4 gruppi da 5 lettere"); $("sync-in").focus(); return; } setCodice(c); return; }
    if (el.id === "sync-copy") { copy(S.codice); return; }
    if (el.id === "sync-now") { pull(); return; }
    if (el.id === "sync-off") { if (el.dataset.sure !== "1") { el.dataset.sure = "1"; el.textContent = "Sì, scollega"; return; } if (setCodice("")) toast("Dispositivo scollegato: i dati restano qui"); return; }
    if (el.id === "fs") { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch { toast("Schermo intero non disponibile qui"); } }
  });
  document.addEventListener("fullscreenchange", () => setTimeout(() => map.invalidateSize(), 150));
  document.addEventListener("input", e => { if (e.target.id === "q") { $("q-clear").hidden = !e.target.value; suggest(e.target.value); saveDraft(); } if (e.target.id === "fname" && S.favForm) S.favForm.name = e.target.value; if (e.target.id === "rname") S.draftName = e.target.value; });
  document.addEventListener("keydown", e => {
    if (e.target.id === "q" && e.key === "Enter") { e.preventDefault(); clearTimeout(typeTimer); search(e.target.value); }
    else if (e.target.id === "q" && e.key === "Escape") { $("res").hidden = true; }
    else if (e.key === "Enter" && e.target.id === "rname") { e.preventDefault(); saveRoute(); }
    else if (e.key === "Enter" && e.target.id === "fname") { e.preventDefault(); saveFav(); }
    else if (e.key === "Enter" && e.target.id === "sync-in") { e.preventDefault(); $("sync-join").click(); }
    else if (e.key === "Escape" && isMobile() && $("panel").classList.contains("open")) closeSheet();
  });
  document.addEventListener("change", e => {
    const sel = e.target;
    if (sel.tagName === "SELECT" && sel.closest("#panel")) { if (MODES[sel.value] && sel.value !== S.mode) { S.mode = sel.value; LS.set("mappa-mezzo", S.mode); S.savedId = null; S.route = null; layers.route.clearLayers(); drawResult(); drawRoutes(); drawSaved(); drawBar(); routeIfReady(); } }
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
  window.addEventListener("storage", e => {
    if (!e.key || e.key === "mappa-codice") { const c = LS.get("mappa-codice", ""); if (c !== S.codice) { conn++; clearTimeout(pushTimer); S.codice = c; S.syncState = ""; S.syncAt = ""; drawSync(); if (c) { dirty = true; pull(); } } if (e.key) return; }
    if (e.key && e.key !== "mappa-dati" && !OLD_KEYS.includes(e.key)) return;
    // Un'altra scheda ha salvato: unisco (non sostituisco), così nessuna delle due perde il suo salvataggio.
    const disk = readDisk(), mem = { routes: S.routes, favs: S.favs, del: S.del };
    const m = merge(mem, disk);
    const memChanged = canon(m) !== canon(merge(mem, {}));
    // Riscrivo solo se mappa-dati (il documento vero, non le chiavi vecchie accostate) non contiene già tutto: una scheda con la versione
    // precedente che ripristina le sue chiavi vecchie con gli stessi dati non fa partire un altro giro di scrittura e cancellazione.
    const diskChanged = !disk.doc || canon([m.routes, m.favs, m.del]) !== canon([disk.doc.routes, disk.doc.favs, disk.doc.del]);
    S.routes = m.routes; S.favs = m.favs; S.del = m.del;
    if (diskChanged) { if (!persist()) toast(NO_SAVE); push(); } // riscrivo solo se sul disco manca qualcosa: niente rimbalzi
    else if (memChanged) { dirty = true; push(); } // la novità è già sul disco ma non ancora sul server
    if (S.savedId && !S.routes.find(x => x.id === S.savedId)) S.savedId = null;
    drawRoutes(); drawFavs(); drawSaved(); drawEnds(); drawResult(); drawBar();
  });
  $("cal").addEventListener("close", () => { S.cal = null; });
  window.addEventListener("hashchange", applyHash);

  /* ---------- Avvio ---------- */
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  { const m = merge({ routes: S.routes, favs: S.favs, del: S.del }, {}); S.routes = m.routes; S.favs = m.favs; S.del = m.del; } // le cancellazioni ricordate valgono anche sui dati letti dal disco
  $("mezzo").value = S.mode; tendine($("panel")); if (!persist()) toast(NO_SAVE); placePick();
  loadDraft();
  drawStops(); drawEnds(); drawRoute(false); drawRoutes(); drawFavs(); drawSaved(); drawResult(); drawSync(); drawBar();
  if (S.pts.length >= 2 && !S.route) routeIfReady(); // la pagina si era chiusa mentre calcolava
  applyHash(); pull();
})();
</script>
